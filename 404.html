<title>주소가 바뀌었습니다 · AIC 공장 시뮬레이터</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://endfield-aic-sim.github.io/">
<script>
// AIC 공장 시뮬레이터 moved to https://endfield-aic-sim.github.io/
// Keeps the page (preview.html) and the #post/123-style address, and hands over what this browser saved on the old address.
(function () {
  var base = 'https://endfield-aic-sim.github.io/';
  var path = location.pathname.replace(/^\/endfield_AIC_simulation\/?/i, '');
  if (!/^(preview\.html)?$/.test(path)) path = '';
  var hash = location.hash || '';
  var url = base + path + hash;
  try {
    var bps = JSON.parse(localStorage.getItem('aic-bp-v2') || 'null');
    var layout = JSON.parse(localStorage.getItem('aic-sim-v2') || 'null');
    if ((bps && bps.length) || (layout && layout.world)) {
      var s = btoa(unescape(encodeURIComponent(JSON.stringify({ bps: bps || [], layout: layout, hash: hash }))))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      if (s.length < 1500000) url = base + path + '#migrate=' + s;
    }
  } catch (e) { /* storage blocked: just move */ }
  location.replace(url);
})();
</script>
